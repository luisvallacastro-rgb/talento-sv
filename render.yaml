services:
  - type: web
    name: talento-sv-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/readiness
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talento-sv-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: DEFAULT_TIME_ZONE
        value: America/El_Salvador
      - key: DEFAULT_CURRENCY
        value: USD
      - key: DEMO_CLIENT_ENABLED
        value: "true"
      - key: DEMO_CLIENT_PASSWORD
        value: ClienteDemo2026!
      - key: DEMO_CLIENT_TOKEN
        generateValue: true
      - key: APP_URL
        value: https://talento-sv-web.onrender.com
      - key: SCANNER_SECRET
        generateValue: true
      - key: WORKER_SECRET
        generateValue: true

databases:
  - name: talento-sv-db
    plan: free
    region: oregon
    databaseName: talento_sv
    user: talento_sv
