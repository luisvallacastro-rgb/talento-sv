services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talento
      POSTGRES_USER: talento
      POSTGRES_PASSWORD: talento_dev
    ports:
      - "5432:5432"
    volumes:
      - talento_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talento -d talento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talento_postgres:
